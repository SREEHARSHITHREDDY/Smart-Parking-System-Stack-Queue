<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Parking System — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #080e14;
      --card:   #0d1f3c;
      --input:  #070d14;
      --border: #0f2035;
      --gold:   #f0c040;
      --cyan:   #00c8f0;
      --green:  #00d48a;
      --red:    #ff4458;
      --text:   #e8f4ff;
      --mid:    #7aa0be;
      --dim:    #3a5570;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 14px #f0c040);
      margin-bottom: 12px;
    }
    .brand-name {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.12em;
    }
    .brand-sub {
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.14em;
      margin-top: 4px;
    }

    /* Card */
    .login-card {
      background: var(--card);
      border: 1px solid #1a3a55;
      border-radius: 16px;
      padding: 36px;
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), var(--cyan), transparent);
      border-radius: 2px;
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.14em;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--dim);
      font-family: 'Orbitron', monospace;
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      padding: 13px 14px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.22s ease;
    }
    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0,200,240,0.22);
    }

    /* Error */
    .error-msg {
      background: rgba(255,68,88,0.1);
      border: 1px solid var(--red);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.75rem;
      color: var(--red);
      margin-bottom: 18px;
      text-align: center;
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f0c040, #c09020);
      border: none;
      border-radius: 8px;
      color: #080e14;
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.22s ease;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(240,192,64,0.35);
    }
    .btn-login:active { transform: translateY(0); }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.62rem;
      color: var(--dim);
    }

    @media (max-width: 480px) {
      .login-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="brand">
      <div class="brand-icon">🅿</div>
      <div class="brand-name">SMART PARKING</div>
      <div class="brand-sub">MANAGEMENT SYSTEM</div>
    </div>

    <div class="login-card">
      <div class="card-title">OPERATOR LOGIN</div>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" name="email" placeholder="admin@smartparking.com"
                 value="{{ email or '' }}" required autofocus />
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">LOGIN →</button>
      </form>
    </div>

    <div class="login-footer">
      Smart Parking System v3.0 · Secure Access
    </div>

  </div>
</body>
</html>
